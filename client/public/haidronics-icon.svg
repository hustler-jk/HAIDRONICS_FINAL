<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1f" />
      <stop offset="100%" stop-color="#e04e00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Chip Background -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="#0d1114" stroke="#ff6417" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Circuit Nodes & Traces -->
  <circle cx="8" cy="8" r="2" fill="#ff6417" />
  <circle cx="40" cy="8" r="2" fill="#ff6417" />
  <circle cx="8" cy="40" r="2" fill="#ff6417" />
  <circle cx="40" cy="40" r="2" fill="#ff6417" />
  <line x1="8" y1="8" x2="14" y2="14" stroke="#ff6417" stroke-width="1" stroke-opacity="0.4" />
  <line x1="40" y1="8" x2="34" y2="14" stroke="#ff6417" stroke-width="1" stroke-opacity="0.4" />
  <line x1="8" y1="40" x2="14" y2="34" stroke="#ff6417" stroke-width="1" stroke-opacity="0.4" />
  <line x1="40" y1="40" x2="34" y2="34" stroke="#ff6417" stroke-width="1" stroke-opacity="0.4" />
  <!-- Main Stylized 'H' -->
  <path d="M14 12 L14 36 M34 12 L34 36 M14 24 L34 24" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Core Microchip Dot -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff" />
  <circle cx="24" cy="24" r="1.5" fill="#ff6417" />
</svg>
